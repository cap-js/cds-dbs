# Use postgres/example user/password credentials
services:
  db:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_PASSWORD: postgres
      # Use UTF-8 locale for proper case conversion with special characters (ö → Ö)
      # while maintaining consistent collation
      LANG: en_US.utf8
      LC_COLLATE: C
      LC_CTYPE: en_US.utf8
    ports:
      - '5432:5432'
    command: ['postgres', '-c', 'log_statement=all']
